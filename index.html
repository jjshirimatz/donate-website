<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donate | Changia</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#14213d;background:#f3f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(100%,440px);background:white;border-radius:26px;box-shadow:0 15px 45px #15345b18;overflow:hidden}.hero{background:linear-gradient(135deg,#0759b9,#163e9e);color:white;padding:30px 25px;text-align:center}.heart{font-size:40px}.hero h1{margin:10px 0 6px;font-size:27px}.hero p{margin:0;opacity:.9;line-height:1.5}.content{padding:25px}.title{font-weight:750;margin-bottom:12px}.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px}.amount{border:1px solid #d6e2ee;background:white;border-radius:12px;padding:14px 3px;font-weight:750;color:#27415c;cursor:pointer}.amount.active{background:#e8f1ff;border:2px solid #1167dc;color:#0754bc;padding:13px 2px}label{display:block;font-size:14px;font-weight:650;margin:15px 0 8px}input{width:100%;border:1px solid #d6e2ee;border-radius:12px;padding:15px;font:inherit;outline:none}input:focus{border-color:#1264cc;box-shadow:0 0 0 3px #1264cc19}.pay{width:100%;border:0;background:#168448;color:white;border-radius:13px;padding:17px;font-size:16px;font-weight:750;margin-top:23px;cursor:pointer}.note{text-align:center;color:#738398;font-size:12px;margin-top:15px;line-height:1.5}.status{margin-top:15px;padding:13px;border-radius:12px;background:#fff7e5;color:#755113;font-size:14px;display:none}.footer{text-align:center;color:#8693a4;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<main class="card">
<section class="hero"><div class="heart">💙</div><h1>Changia Leo</h1><p>Mchango wako unatusaidia kuendelea na kazi zetu. Asante kwa kutuunga mkono!</p></section>
<section class="content">
<div class="title">Chagua kiasi cha kuchangia</div>
<div class="amounts"><button class="amount" data-amount="1000">1,000</button><button class="amount active" data-amount="5000">5,000</button><button class="amount" data-amount="10000">10,000</button></div>
<form id="donateForm">
<label for="amount">Kiasi (TZS)</label><input id="amount" name="amount" type="number" min="100" step="1" value="5000" required inputmode="numeric">
<label for="phone">Namba ya simu</label><input id="phone" name="phone" type="tel" inputmode="tel" placeholder="07XXXXXXXX" autocomplete="tel" pattern="(?:\+255|255|0)[67][0-9]{8}" title="Weka namba ya Tanzania, mfano 0712345678" required>
<button class="pay" type="submit">🔒 Changia Sasa</button>
<div id="status" class="status" role="status" aria-live="polite"></div>
</form>
<div class="note">Huu ni ukurasa wa majaribio. Malipo halisi bado hayajaunganishwa na Snippe.</div>
<div class="footer">© 2026 Donate Website</div>
</section>
</main>
<script>
const amountInput=document.getElementById('amount');
const amountButtons=[...document.querySelectorAll('.amount')];
amountButtons.forEach(btn=>btn.addEventListener('click',()=>{amountInput.value=btn.dataset.amount;amountButtons.forEach(b=>b.classList.toggle('active',b===btn));}));
amountInput.addEventListener('input',()=>amountButtons.forEach(b=>b.classList.toggle('active',b.dataset.amount===amountInput.value)));
document.getElementById('donateForm').addEventListener('submit',e=>{e.preventDefault();const amount=Number(amountInput.value);const phone=document.getElementById('phone').value.trim();if(!Number.isSafeInteger(amount)||amount<100){amountInput.setCustomValidity('Weka kiasi halali kuanzia TZS 100');amountInput.reportValidity();amountInput.setCustomValidity('');return;}const status=document.getElementById('status');status.style.display='block';status.textContent=`Majaribio pekee: Umechagua TZS ${amount.toLocaleString('en-US')} kwa namba ${phone}. Hakuna pesa iliyokatwa. Tutaunganisha malipo halisi baada ya kuweka backend ya Snippe.`;});
</script>
</body>
</html>
